[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# No per-function `timeout` keys here on purpose. Synchronous Netlify
# functions are capped at 10s (free) / 26s (Pro, and only after you ask
# support to raise it). Extraction blows past both, so extract-loi runs as a
# *background* function instead — the `-background` filename suffix gives it
# 15 minutes. Background functions require a paid Netlify plan.
